name: Bug report
description: Something else is wrong, e.g. an exception, a crash, or a packaging problem.
labels: ["bug"]
body:
  - type: input
    id: package-version
    attributes:
      label: FluentBgWords version
      placeholder: 0.1.1
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      description: The target framework or the output of `dotnet --version`.
      placeholder: net8.0
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal code sample
      description: The smallest code that shows the problem.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full exception message and stack trace, if there is one.
    validations:
      required: true
